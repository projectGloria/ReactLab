<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" fill="none">
  <rect width="860" height="300" rx="12" fill="#0f1118" stroke="#1f2433" stroke-width="1.5" />
  
  <!-- Header -->
  <rect width="860" height="36" rx="12" fill="#151824" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="36" cy="18" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="52" cy="18" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="76" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">REACTLAB SYSTEM ARCHITECTURE • DUAL-SANDBOX EXECUTION PIPELINE</text>

  <!-- Flowchart Diagram -->
  <g transform="translate(30, 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Box 1: Learner Code & Editor -->
    <g transform="translate(0, 40)">
      <rect width="180" height="130" rx="8" fill="#141824" stroke="#252d42" stroke-width="1.5" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#1e293b" />
      <text x="26" y="33" fill="#61dafb" font-size="14" font-weight="700" text-anchor="middle">⚛</text>
      <text x="50" y="32" fill="#f8fafc" font-size="12" font-weight="700">Code Editor</text>
      <text x="14" y="66" fill="#94a3b8" font-size="10.5">• React 19 JSX / TSX</text>
      <text x="14" y="86" fill="#94a3b8" font-size="10.5">• Multi-file Tab Assembly</text>
      <text x="14" y="106" fill="#94a3b8" font-size="10.5">• AST Validator &amp; Tests</text>
      <text x="14" y="124" fill="#38bdf8" font-size="10" font-weight="600">src/components/lesson/</text>
    </g>

    <!-- Branch Arrow 1 (Online) -->
    <path d="M180 80 L 250 80 L 250 35 L 300 35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
    <polygon points="300,32 308,35 300,38" fill="#38bdf8" />
    <rect x="195" y="44" width="70" height="18" rx="4" fill="#0c4a6e" />
    <text x="230" y="56" fill="#7dd3fc" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>

    <!-- Box 2: Sandpack Hosted Engine -->
    <g transform="translate(310, 0)">
      <rect width="210" height="70" rx="8" fill="#141824" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="700">Sandpack Hosted Bundler</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10.5">Cloud sandbox compilation</text>
      <text x="14" y="60" fill="#64748b" font-size="10">@codesandbox/sandpack-react</text>
    </g>

    <!-- Branch Arrow 2 (Offline) -->
    <path d="M180 130 L 250 130 L 250 145 L 300 145" stroke="#10b981" stroke-width="2" fill="none" />
    <polygon points="300,142 308,145 300,148" fill="#10b981" />
    <rect x="195" y="118" width="70" height="18" rx="4" fill="#064e3b" />
    <text x="230" y="130" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">OFFLINE</text>

    <!-- Box 3: Local Offline Bundler -->
    <g transform="translate(310, 100)">
      <rect width="210" height="110" rx="8" fill="#141824" stroke="#10b981" stroke-width="1.5" />
      <text x="14" y="24" fill="#10b981" font-size="12" font-weight="700">Local Bundler (In-Browser)</text>
      <text x="14" y="44" fill="#cbd5e1" font-size="10.5">Babel-Standalone (CommonJS)</text>
      <text x="14" y="64" fill="#94a3b8" font-size="10">• Pre-bundled React 19, Router,</text>
      <text x="14" y="78" fill="#94a3b8" font-size="10">  Zustand, Query &amp; Lucide</text>
      <text x="14" y="98" fill="#6ee7b7" font-size="10" font-weight="600">Zero network pings required</text>
    </g>

    <!-- Merge to Live DOM Preview -->
    <path d="M520 35 L 560 35 L 560 85 L 590 85" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
    <polygon points="590,82 598,85 590,88" fill="#38bdf8" />

    <path d="M520 155 L 560 155 L 560 115 L 590 115" stroke="#10b981" stroke-width="2" fill="none" />
    <polygon points="590,112 598,115 590,118" fill="#10b981" />

    <!-- Box 4: Execution Output & Diagnostics -->
    <g transform="translate(600, 40)">
      <rect width="190" height="130" rx="8" fill="#141824" stroke="#252d42" stroke-width="1.5" />
      <text x="14" y="26" fill="#f8fafc" font-size="12" font-weight="700">Live Preview &amp; Runtime</text>
      <text x="14" y="52" fill="#94a3b8" font-size="10.5">Isolated iframe DOM</text>
      <text x="14" y="72" fill="#94a3b8" font-size="10.5">Runtime test assertions</text>
      
      <!-- Sub-badge worker -->
      <rect x="12" y="88" width="166" height="30" rx="4" fill="#1e2433" />
      <text x="20" y="102" fill="#38bdf8" font-size="9.5" font-weight="700">TypeScript Web Worker</text>
      <text x="20" y="114" fill="#94a3b8" font-size="9">Offline language service</text>
    </g>
  </g>
</svg>
