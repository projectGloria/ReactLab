<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#2d3139" stroke-width="2"/>
  <g transform="translate(128 128)" fill="none" stroke="#61dafb" stroke-width="9" filter="url(#glow)">
    <ellipse rx="94" ry="36"/>
    <ellipse rx="94" ry="36" transform="rotate(60)"/>
    <ellipse rx="94" ry="36" transform="rotate(120)"/>
  </g>
  <circle cx="128" cy="128" r="14" fill="#61dafb" filter="url(#glow)"/>
</svg>
