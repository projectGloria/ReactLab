            <tspan fill="#60a5fa">&lt;</tspan><tspan fill="#f43f5e">button</tspan>
            <tspan fill="#e2e8f0"> onClick</tspan><tspan fill="#94a3b8">={() =&gt; </tspan><tspan fill="#60a5fa">setCount</tspan><tspan fill="#94a3b8">(c =&gt; c + 1)}&gt;</tspan>
