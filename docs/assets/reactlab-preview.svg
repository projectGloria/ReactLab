            <tspan fill="#94a3b8"> [</tspan><tspan fill="#f1f5f9">count</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#60a5fa">setCount</tspan><tspan fill="#94a3b8">] = </tspan><tspan fill="#38bdf8">useState</tspan><tspan fill="#94a3b8">(0);</tspan>
          </text>

