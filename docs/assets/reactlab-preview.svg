            <tspan fill="#e2e8f0"> className</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#a5f3fc">"counter-card"</tspan><tspan fill="#60a5fa">&gt;</tspan>
          </text>

          <!-- Line 8 -->
