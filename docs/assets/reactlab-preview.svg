            <tspan fill="#60a5fa">&lt;</tspan><tspan fill="#f43f5e">h2</tspan><tspan fill="#60a5fa">&gt;</tspan><tspan fill="#f1f5f9">Clicks: {count}</tspan><tspan fill="#60a5fa">&lt;/</tspan><tspan fill="#f43f5e">h2</tspan><tspan fill="#60a5fa">&gt;</tspan>
          </text>

          <!-- Line 9 -->
