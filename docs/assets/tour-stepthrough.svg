<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" fill="none">
  <rect width="760" height="220" rx="12" fill="#0f1118" stroke="#1f2433" stroke-width="1.5" />
  
  <!-- Header -->
  <rect width="760" height="36" rx="12" fill="#151824" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="36" cy="18" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="52" cy="18" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="76" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">STEPTHROUGH CODE TOUR • SYNCHRONIZED AUDIO NARRATION</text>
  
  <!-- Content Area -->
  <!-- Left: Code Highlight Snippet -->
  <g transform="translate(20, 50)" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12">
    <rect width="440" height="150" rx="8" fill="#090a0f" stroke="#1b2030" stroke-width="1" />
    
    <!-- Dim lines -->
    <text x="20" y="32" fill="#475569">1  function UserProfile({ userId }) {</text>
    <text x="20" y="56" fill="#475569">2    const [user, setUser] = useState(null);</text>
    
    <!-- Highlighted Active Line with glow -->
    <rect x="10" y="68" width="420" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="20" y="87" fill="#f1f5f9" font-weight="600">
      <tspan fill="#38bdf8">3    useEffect</tspan><tspan fill="#e2e8f0">(() =&gt; { fetchUser(userId).then(setUser); }, [userId]);</tspan>
    </text>
    
    <text x="20" y="118" fill="#475569">4    return &lt;div&gt;{user?.name}&lt;/div&gt;;</text>
    <text x="20" y="140" fill="#475569">5  }</text>
  </g>

  <!-- Right: Voice & Concept Explanation Card -->
  <g transform="translate(480, 50)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect width="260" height="150" rx="8" fill="#141824" stroke="#252d42" stroke-width="1" />
    
    <!-- Step Badge -->
    <rect x="16" y="16" width="76" height="20" rx="10" fill="#0284c7" />
    <text x="24" y="30" fill="#ffffff" font-size="10.5" font-weight="700">STEP 2 OF 4</text>
    
    <text x="16" y="58" fill="#f8fafc" font-size="13" font-weight="700">Dependency Array Sync</text>
    <text x="16" y="78" fill="#94a3b8" font-size="11" width="228">
      "Whenever <tspan fill="#38bdf8">userId</tspan> changes, React reruns this effect to synchronize with the external network."
    </text>

    <!-- Audio Player widget -->
    <g transform="translate(16, 108)">
      <rect width="228" height="28" rx="14" fill="#1e2538" />
      <circle cx="16" cy="14" r="9" fill="#38bdf8" />
      <polygon points="14,10 20,14 14,18" fill="#0f172a" />
      <!-- Soundwave bars -->
      <rect x="36" y="9" width="3" height="10" rx="1.5" fill="#38bdf8" />
      <rect x="43" y="6" width="3" height="16" rx="1.5" fill="#38bdf8" />
      <rect x="50" y="11" width="3" height="6" rx="1.5" fill="#38bdf8" />
      <rect x="57" y="7" width="3" height="14" rx="1.5" fill="#38bdf8" />
      <rect x="64" y="10" width="3" height="8" rx="1.5" fill="#38bdf8" />
      <rect x="71" y="8" width="3" height="12" rx="1.5" fill="#38bdf8" />
      <text x="175" y="18" fill="#94a3b8" font-size="10" font-weight="600">0:14 / 0:38</text>
    </g>
  </g>
</svg>
